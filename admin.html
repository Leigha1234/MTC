<!DOCTYPE html>
<html>
<head>
    <title>MTC Admin | Secure Login</title>
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #1a1a1a; color: white; padding: 40px; max-width: 800px; margin: auto; }
        .card { background: #222; padding: 30px; border-radius: 8px; border-left: 5px solid #D4AF37; margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 10px; color: #D4AF37; text-transform: uppercase; letter-spacing: 1px; }
        textarea, input { width: 100%; margin-bottom: 20px; background: #333; color: white; border: 1px solid #444; padding: 15px; border-radius: 4px; font-size: 1rem; }
        .save-btn { background: #D4AF37; color: black; padding: 20px; border: none; cursor: pointer; font-weight: bold; width: 100%; font-size: 1.2rem; border-radius: 4px; }
        .save-btn:hover { background: #b8962d; }
    </style>
</head>
<body>
    <h1>PACK CONTENT MANAGER</h1>
    
    <div class="card">
        <label>Security Key</label>
        <input type="password" id="admin-pass" placeholder="Enter Mike's Password">
    </div>

    <div class="card">
        <label>Hero Title (HTML Allowed)</label>
        <textarea id="edit-hero-title"></textarea>

        <label>MTC Description</label>
        <textarea id="edit-mtc-desc"></textarea>

        <label>Mums & Tots Description</label>
        <textarea id="edit-tots-desc"></textarea>

        <label>Legends (50+) Description</label>
        <textarea id="edit-legends-desc"></textarea>
    </div>

    <button class="save-btn" onclick="save()">PUSH UPDATES TO WEBSITE</button>

    <script>
        // Pre-fill fields with current live content
        fetch('/api/content').then(res => res.json()).then(data => {
            document.getElementById('edit-hero-title').value = data.heroTitle;
            document.getElementById('edit-mtc-desc').value = data.mtcDesc;
            document.getElementById('edit-tots-desc').value = data.totsDesc;
            document.getElementById('edit-legends-desc').value = data.legendsDesc;
        });

        function save() {
            const pass = document.getElementById('admin-pass').value;
            const updatedData = {
                heroTitle: document.getElementById('edit-hero-title').value,
                mtcDesc: document.getElementById('edit-mtc-desc').value,
                totsDesc: document.getElementById('edit-tots-desc').value,
                legendsDesc: document.getElementById('edit-legends-desc').value
            };

            fetch('/api/save', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ password: pass, data: updatedData })
            })
            .then(res => {
                if(res.ok) {
                    alert("Success! The Pack website has been updated.");
                } else {
                    alert("Error: Incorrect Security Key.");
                }
            });
        }
    </script>
</body>
</html>
