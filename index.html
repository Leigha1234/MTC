<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moray Training Club | The Pack</title>
    <style>
        :root { --gold: #ffcc00; --dark: #000000; }
        body { font-family: 'Arial', sans-serif; background: var(--dark); color: #fff; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        /* Navigation & Hero */
        nav, .hero { text-align: center; padding: 40px 0; }
        .hero h1 { font-size: 3rem; color: var(--gold); }
        
        /* Training Tabs */
        .tab-button-panel { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .tab-btn { background: transparent; color: #fff; border: 1px solid #444; padding: 12px 20px; cursor: pointer; }
        .tab-btn.active { background: var(--gold); color: #000; }
        
        /* Layout Grid */
        .main-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .img-frame img { width: 100%; height: auto; object-fit: contain; display: block; }
        
        /* Booking & Footer */
        .booking-box { border: 2px solid var(--gold); padding: 20px; }
        footer { margin-top: 50px; padding: 20px; text-align: center; border-top: 1px solid #333; }
        footer a { color: #aaa; margin: 0 10px; text-decoration: none; }
    </style>
</head>
<body>

<nav>Moray Training Club Logo</nav>

<header class="hero">
    <h1>ONE PACK, NO EGO. REAL FITNESS RESULTS.</h1>
</header>

<div class="container">
    <div class="tab-button-panel">
        <button class="tab-btn" onclick="updateView('lite')">CrossFit Lite</button>
        <button class="tab-btn" onclick="updateView('circuits')">Circuits</button>
        <button class="tab-btn" onclick="updateView('strong')">STRONG Track</button>
        <button class="tab-btn" onclick="updateView('preteens')">Preteens</button>
        <button class="tab-btn" onclick="updateView('mums')">Mums and Family</button>
    </div>

    <div class="main-layout">
        <div id="track-viewport">
            <div class="img-frame"><img id="track-img" src="assets/Mike11.jpg" alt="Track"></div>
        </div>
        
        <div>
            <div class="booking-box">
                <h2>SECURE YOUR PACK SLOT</h2>
                <p>Click below to book your session via TeamUp.</p>
                <a href="https://goteamup.com/p/3936927-crossfit-moray/" style="background:var(--gold); padding:15px; display:block; text-align:center; color:#000; text-decoration:none; font-weight:bold;">BOOK CLASS AT TEAMUP</a>
            </div>
            <div style="margin-top:20px;">
                <h3>FIND THE BOX</h3>
                <img src="image_5660c0.jpg" alt="Map" style="width:100%;">
            </div>
        </div>
    </div>
</div>

<footer>
    <a href="terms.html">Terms</a> | <a href="socialmedia.html">Social Media</a> | 
    <a href="safeguarding.html">Safeguarding</a> | <a href="policy.html">Policy</a> | 
    <a href="health-safety.html">Health & Safety</a> | <a href="gdpr.html">GDPR</a> | 
    <a href="complaints.html">Complaints</a>
    <div style="margin-top:15px;">This site uses cookies. <a href="cookies.html">Learn More</a></div>
</footer>

<script>
    const trackData = {
        lite: "Mike11.jpg",
        circuits: "Mike10.jpg",
        strong: "Mike7.jpg",
        preteens: "Mike8.jpg",
        mums: "Mike5.jpg"
    };

    function updateView(key) {
        document.getElementById('track-img').src = "assets/" + trackData[key];
    }
</script>

</body>
</html>
