<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moray Training Club | The Pack</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700;900&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffcc00; --dark: #000000; }
        body { font-family: 'Montserrat', sans-serif; background: var(--dark); color: #fff; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        .tab-button-panel { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 40px; }
        .tab-btn { background: #111; color: #fff; border: 2px solid #333; padding: 12px 24px; cursor: pointer; font-family: 'Teko'; font-size: 1.2rem; }
        .tab-btn.active { background: var(--gold); color: #000; border-color: var(--gold); }
        
        .track-display-viewport { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; border: 2px solid #222; padding: 40px; background: #0a0a0a; }
        .img-frame { border: 3px solid var(--gold); overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; }
        .img-frame img { width: 100%; height: 450px; object-fit: cover; }
        
        @media (max-width: 850px) { .track-display-viewport { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <section id="training-tracks">
        <div class="container">
            <h2 style="text-align: center; font-size: 3rem;">OUR TRACKS</h2>
            <div class="tab-button-panel" id="tab-panel">
                <button class="tab-btn active" onclick="switchTrackViewport('lite', this)">CrossFit Lite</button>
                <button class="tab-btn" onclick="switchTrackViewport('strong', this)">STRONG Track</button>
            </div>
            <div class="track-display-viewport" id="track-viewport-display"></div>
        </div>
    </section>

    <script>
        const trackData = {
            lite: { title: "CROSSFIT LITE", subtitle: "Stronger. Fitter. Made Simple.", image: "Mike7.jpeg" },
            strong: { title: "STRONG TRACK", subtitle: "Lift Heavy. Move Well.", image: "Mike11.jpeg" }
        };

        function switchTrackViewport(trackKey, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const track = trackData[trackKey];
            const displayZone = document.getElementById('track-viewport-display');

            // I changed the src to 'assets/' (relative to your index file)
            // If this still fails, your browser console will show you the exact broken path.
            displayZone.innerHTML = `
                <div>
                    <h1 style="font-family:'Teko'; font-size:3.5rem;">${track.title}</h1>
                    <p style="color:var(--gold); font-size:1.5rem;">${track.subtitle}</p>
                </div>
                <div class="img-frame">
                    <img src="assets/${track.image}" alt="${track.title}" 
                    onerror="this.parentElement.innerHTML='<p style=\'padding:20px; text-align:center;\'>Image not found: assets/${track.image}</p>'">
                </div>
            `;
        }

        switchTrackViewport('lite', document.querySelector('.tab-btn'));
    </script>
</body>
</html>
