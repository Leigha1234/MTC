<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moray Training Club | The Pack</title>
    <style>
        :root { --gold: #ffcc00; --dark: #000000; }
        body { font-family: sans-serif; background: var(--dark); color: #fff; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        /* Remove black backgrounds from tabs */
        .tab-btn { background: transparent; color: #fff; border: 1px solid #444; padding: 10px; cursor: pointer; }
        .tab-btn.active { background: var(--gold); color: #000; }
        
        /* Ensure images show fully */
        .img-frame img { width: 100%; height: auto; object-fit: contain; display: block; }
        
        footer { padding: 40px 0; border-top: 1px solid #333; text-align: center; font-size: 0.8rem; }
        footer a { color: #fff; margin: 0 10px; text-decoration: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Tracks Section -->
        <div id="track-viewport-display"></div>
        
        <!-- Booking Redirect -->
        <section id="contact">
            <h3>Ready to join?</h3>
            <a href="https://goteamup.com/p/3936927-crossfit-moray/" target="_blank" style="background:var(--gold); padding:15px; color:#000; text-decoration:none; font-weight:bold;">BOOK YOUR CLASS HERE</a>
        </section>
    </div>

    <!-- Footer with your specific links -->
    <footer>
        <a href="terms.html">Terms</a>
        <a href="socialmedia.html">Social Media</a>
        <a href="safeguarding.html">Safeguarding</a>
        <a href="policy.html">Policy</a>
        <a href="health-safety.html">Health & Safety</a>
        <a href="gdpr.html">GDPR</a>
        <a href="complaints.html">Complaints</a>
    </footer>

    <!-- Cookie Policy -->
    <div style="text-align: center; padding: 10px; background: #222;">
        This site uses cookies. <a href="cookies.html">Learn More</a>
    </div>

    <script>
        const trackData = {
            lite: { title: "CrossFit Lite", image: "Mike11.jpg" },
            circuits: { title: "Circuits", image: "Mike10.jpg" },
            strong: { title: "STRONG Track", image: "Mike7.jpg" },
            preteens: { title: "Preteens", image: "Mike8.jpg" },
            mums: { title: "Mums and Family", image: "Mike5.jpg" }
        };

        function switchTrackViewport(key) {
            const track = trackData[key];
            document.getElementById('track-viewport-display').innerHTML = `
                <h1>${track.title}</h1>
                <div class="img-frame"><img src="assets/${track.image}" alt="${track.title}"></div>
            `;
        }
    </script>
</body>
</html>
