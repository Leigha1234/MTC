<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Moray Training Club</title>
    <style>
        :root { --gold: #ffcc00; --dark: #000000; }
        body { background: var(--dark); color: #fff; font-family: sans-serif; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        
        /* Nav & Hero */
        header { text-align: center; padding: 40px; }
        .hero-title { font-size: 3rem; color: var(--gold); }
        
        /* Tabs - No Black Background */
        .tab-panel { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 30px 0; }
        .tab-btn { border: 1px solid var(--gold); padding: 10px 20px; cursor: pointer; color: #fff; background: transparent; }
        .tab-btn.active { background: var(--gold); color: #000; }
        
        /* Main Layout */
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
        .img-frame img { width: 100%; height: auto; }
        
        /* Booking & Map */
        .booking-box { border: 2px solid var(--gold); padding: 20px; }
        .map-box { border: 2px solid var(--gold); margin-top: 20px; }
        
        /* Footer */
        footer { margin-top: 50px; border-top: 1px solid #333; padding: 20px; text-align: center; font-size: 0.8rem; }
        footer a { color: #fff; margin: 0 5px; }
    </style>
</head>
<body>

<header>
    <h1 class="hero-title">MORAY TRAINING CLUB</h1>
    <p>ONE PACK, NO EGO. REAL FITNESS RESULTS.</p>
</header>

<div class="container">
    <h2>EXPLORE OUR PACK TRAINING TRACKS</h2>
    <div class="tab-panel">
        <button class="tab-btn" onclick="updateView('lite')">CrossFit Lite</button>
        <button class="tab-btn" onclick="updateView('circuits')">Circuits</button>
        <button class="tab-btn" onclick="updateView('strong')">STRONG Track</button>
        <button class="tab-btn" onclick="updateView('preteens')">Preteens</button>
        <button class="tab-btn" onclick="updateView('mums')">Mums and Family</button>
    </div>

    <div class="grid-layout">
        <div id="viewport" class="img-frame">
            <img id="main-img" src="assets/Mike11.jpg" alt="Training">
        </div>

        <div class="booking-box">
            <h2>SECURE YOUR PACK SLOT</h2>
            <a href="https://goteamup.com/p/3936927-crossfit-moray/" style="display:block; background:var(--gold); color:#000; padding:20px; text-align:center; font-weight:bold; text-decoration:none;">BOOK YOUR CLASS HERE</a>
            
            <div class="map-box">
                <img src="image_5660c0.jpg" alt="Find the Box" style="width:100%;">
            </div>
        </div>
    </div>
</div>

<footer>
    <a href="terms.html">Terms</a> | <a href="socialmedia.html">Social Media</a> | 
    <a href="safeguarding.html">Safeguarding</a> | <a href="policy.html">Policy</a> | 
    <a href="health-safety.html">Health & Safety</a> | <a href="gdpr.html">GDPR</a> | 
    <a href="complaints.html">Complaints</a>
    <div style="margin-top:10px;">
        This site uses analytical tracking parameters. <a href="cookies.html">Learn More</a>
    </div>
</footer>

<script>
    const images = {
        lite: "Mike11.jpg",
        circuits: "Mike10.jpg",
        strong: "Mike7.jpg",
        preteens: "Mike8.jpg",
        mums: "Mike5.jpg"
    };

    function updateView(key) {
        document.getElementById('main-img').src = "assets/" + images[key];
    }
</script>

</body>
</html>
