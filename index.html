<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moray Training Club | The Pack</title>
    <style>
        :root { --gold: #ffcc00; --dark: #000000; }
        body { font-family: 'Arial', sans-serif; background: var(--dark); color: #fff; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        /* Layout */
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        
        /* Updated Tab Styles - No Black Background */
        .tab-button-panel { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
        .tab-btn { background: transparent; color: #fff; border: 1px solid #444; padding: 10px 20px; cursor: pointer; }
        .tab-btn.active { background: var(--gold); color: #000; }
        
        /* Image Display - Full View */
        .img-frame img { width: 100%; height: auto; display: block; }
        
        /* Booking Section */
        .booking-box { border: 1px solid var(--gold); padding: 20px; }
        .booking-btn { display: block; width: 100%; background: var(--gold); color: #000; padding: 15px; text-align: center; text-decoration: none; font-weight: bold; margin-top: 20px; }
        
        footer { margin-top: 50px; padding: 20px; text-align: center; border-top: 1px solid #333; }
        footer a { color: #aaa; margin: 0 10px; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>MORAY TRAINING CLUB</h1>
    
    <div class="tab-button-panel">
        <button class="tab-btn" onclick="updateView('lite')">CrossFit Lite</button>
        <button class="tab-btn" onclick="updateView('circuits')">Circuits</button>
        <button class="tab-btn" onclick="updateView('strong')">STRONG Track</button>
        <button class="tab-btn" onclick="updateView('preteens')">Preteens</button>
        <button class="tab-btn" onclick="updateView('mums')">Mums and Family</button>
    </div>

    <div class="grid-layout">
        <div id="track-display">
            <!-- Viewport content -->
        </div>

        <div class="booking-box">
            <h2>SECURE YOUR PACK SLOT</h2>
            <p>Ready to join? Book your class directly through our system.</p>
            <a href="https://goteamup.com/p/3936927-crossfit-moray/" class="booking-btn" target="_blank">BOOK YOUR CLASS AT TEAMUP</a>
        </div>
    </div>
</div>

<footer>
    <a href="terms.html">Terms</a>
    <a href="socialmedia.html">Social Media</a>
    <a href="safeguarding.html">Safeguarding</a>
    <a href="policy.html">Policy</a>
    <a href="health-safety.html">Health & Safety</a>
    <a href="gdpr.html">GDPR</a>
    <a href="complaints.html">Complaints</a>
    <div style="margin-top: 15px;">
        This site uses analytical tracking parameters. <a href="cookies.html">Learn More</a>
    </div>
</footer>

<script>
    const trackData = {
        lite: { title: "CrossFit Lite", image: "Mike11.jpg" },
        circuits: { title: "Circuits", image: "Mike10.jpg" },
        strong: { title: "STRONG Track", image: "Mike7.jpg" },
        preteens: { title: "Preteens", image: "Mike8.jpg" },
        mums: { title: "Mums and Family", image: "Mike5.jpg" }
    };

    function updateView(key) {
        const track = trackData[key];
        document.getElementById('track-display').innerHTML = `
            <h2>${track.title}</h2>
            <div class="img-frame"><img src="assets/${track.image}" alt="${track.title}"></div>
        `;
    }
    updateView('lite');
</script>

</body>
</html>
